<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfer Decoder</title>
<meta name="description" content="Step-by-step animated Prüfer sequence to tree decoder">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: controls + sequence strip on top, graph-paper stage left, step narration right; stacks on phones */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#1b2422; --muted:#5d6b67; --line:#d5dcd9; --grid:#e6ebe9;
  --ink:#1f6f78; --leaf:#d9822b; --parent:#3b5bdb; --gone:#b9c2bf;
  --display:"Bricolage Grotesque","IBM Plex Sans Hebrew",system-ui,sans-serif; --body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2220; --fg:#e4ebe8; --muted:#97a6a1; --line:#2e3a37; --grid:#1f2826;
  --ink:#5cc3cc; --leaf:#f0a050; --parent:#7f9cff; --gone:#47524f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2220; --fg:#e4ebe8; --muted:#97a6a1; --line:#2e3a37; --grid:#1f2826;
  --ink:#5cc3cc; --leaf:#f0a050; --parent:#7f9cff; --gone:#47524f; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding:24px 16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
h1{font:800 clamp(28px,5vw,42px)/1.05 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.top>div{min-width:0}
.lede{color:var(--muted);margin:6px 0 0;max-width:65ch}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:grid;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:1 1 220px;min-width:0}
input[type=text]{font:500 16px var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-transform:none;letter-spacing:0}
button{font:600 14px var(--body);padding:9px 14px;min-height:44px;touch-action:manipulation;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:#c0392b;font-weight:500;flex-basis:100%;margin:0}
.err:empty{display:none}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.strip .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-inline-end:6px;min-width:84px}
.chip{font:500 14px var(--mono);padding:4px 9px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.chip.done{opacity:.35;text-decoration:line-through}
.chip.cur{border-color:var(--parent);color:var(--parent);box-shadow:0 0 0 2px var(--parent) inset}
.chip.leaf{border-color:var(--leaf);color:var(--leaf)}
.chip.zero{opacity:.35}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
svg{display:block;width:100%;height:auto}
.edge{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.edge.new{stroke:var(--leaf);stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.node circle{fill:var(--panel);stroke:var(--fg);stroke-width:2}
.node text{fill:var(--fg);font:600 15px var(--mono);text-anchor:middle;dominant-baseline:central}
.node.leaf circle{stroke:var(--leaf);stroke-width:4}
.node.parent circle{stroke:var(--parent);stroke-width:4}
.node.gone circle{stroke:var(--gone)}
.node.gone text{fill:var(--gone)}
.node .deg{font:500 11px var(--mono);fill:var(--muted)}
.side{display:grid;gap:14px;align-content:start}
.steps{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#explain{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-height:150px}
#explain h2{font:600 20px/1.2 var(--display);margin:0 0 8px}
#explain p{margin:0 0 8px}
#explain b.l{color:var(--leaf)} #explain b.p{color:var(--parent)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{flex:0 1 auto;display:flex;align-items:center;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;margin-inline-end:6px;vertical-align:-2px}
.legend .a::before{border-color:var(--leaf)} .legend .b::before{border-color:var(--parent)} .legend .c::before{border-color:var(--gone)}
@media (max-width:760px){
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .ctrls{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--panel);border-top:1px solid var(--line);flex-wrap:nowrap}
  .ctrls button{flex:1}
  .ctrls label{display:none}
  .tip{display:none}
  form button{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){.edge.new{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1 data-t="h1">Prüfer Decoder</h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <button type="button" id="lang" lang="he">עברית</button>
  </header>

  <form id="f">
    <label for="labels"><span data-t="labelsLbl"></span>
      <input type="text" id="labels" value="1 2 3 4 5 6 7 8 9" dir="ltr">
    </label>
    <label for="seq"><span data-t="seqLbl"></span>
      <input type="text" id="seq" value="4 4 2 6 6 9 9" dir="ltr">
    </label>
    <button class="primary" type="submit" data-t="build"></button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div class="strip" id="seqStrip"></div>
  <div class="strip" id="degStrip"></div>

  <div class="main">
    <div class="stage"><svg id="svg" viewBox="0 0 640 460" role="img" dir="ltr"></svg></div>
    <div class="side">
      <div class="ctrls">
        <button type="button" id="prev" data-t="prev"></button>
        <button type="button" id="play" class="primary"></button>
        <button type="button" id="next" data-t="next"></button>
        <label for="speed"><span data-t="speed"></span> <input type="range" id="speed" min="400" max="3000" step="100" value="1600"></label>
      </div>
      <div class="steps" id="counter"></div>
      <div id="explain" aria-live="polite"></div>
      <div class="legend"><span class="a" data-t="lgLeaf"></span><span class="b" data-t="lgSeq"></span><span class="c" data-t="lgGone"></span></div>
      <p class="lede tip" style="font-size:13px" data-t="tip"></p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let W = 640, H = 460;
const R = 19;
const split = s => s.split(/[\s,]+/).filter(Boolean);
const cmp = (a, b) => (isNaN(a) || isNaN(b)) ? a.localeCompare(b) : a - b;
const B = (v, c = '') => `<b${c ? ` class="${c}"` : ''}><bdi>${v}</bdi></b>`;

const T = {
  en: {
    h1: 'Prüfer Decoder',
    lede: 'Enter the node labels and a Prüfer sequence. The decoder rebuilds the unique labeled tree one edge at a time, explaining every choice. A sequence of length n−2 always describes a tree on n nodes.',
    labelsLbl: 'Node labels (space or comma separated; blank = 1…n)', seqLbl: 'Prüfer sequence', build: 'Build tree',
    prev: '◀ Back', next: 'Next ▶', play: '▶ Play', pause: '❚❚ Pause', speed: 'Speed',
    lgLeaf: 'smallest leaf', lgSeq: 'sequence entry', lgGone: 'removed',
    tip: 'Tip: ← / → keys step, space plays. Labels are ordered numerically if they are all numbers, otherwise alphabetically.',
    seqK: 'Sequence', degK: 'Degrees', empty: 'empty', deg: 'deg', svg: 'Tree being built',
    counter: (i, n) => `Step ${i} of ${n}`,
    eUnique: 'Each label must be unique.', eMin: 'A tree needs at least 2 nodes.',
    eLen: (n, k) => `With ${n} labels the sequence must have exactly ${n - 2} entries (it has ${k}).`,
    eBad: v => `Sequence entries not in the label list: ${v}.`,
    start: s => ({ t: 'Setup: count degrees', h: `<p>The sequence has ${B(s.k)} entries, so the tree has ${B(`${s.k}+2 = ${s.n}`)} nodes and ${B(s.n - 1)} edges.</p>
      <p>Every node's degree is <b>1 + (times it appears in the sequence)</b>. Nodes that never appear have degree 1: they are the leaves.</p>
      <p>Current leaves: ${B(s.leaves || '–')}.</p>` }),
    pick: s => ({ t: `Step ${s.i}: read “${s.parent}”`, h: `<p>Next sequence entry is ${B(s.parent, 'p')}.</p>
      <p>Leaves right now (degree 1): ${B(s.leaves)}. The smallest is ${B(s.leaf, 'l')}.</p>
      <p>The sequence was made by repeatedly removing the smallest leaf and writing down its neighbour, so ${B(s.leaf, 'l')} must have been attached to ${B(s.parent, 'p')}.</p>` }),
    link: s => ({ t: `Step ${s.i}: connect ${s.leaf} — ${s.parent}`, h: `<p>Add edge ${B(s.leaf, 'l')} — ${B(s.parent, 'p')}.</p>
      <p>${B(s.leaf, 'l')} is now finished: its degree drops to 0 and it is removed.</p>
      <p>${B(s.parent, 'p')} used one of its slots: degree ${s.d} → ${s.d - 1}.${s.d === 2 ? ' It has become a leaf itself.' : ''}</p>` }),
    last: s => ({ t: 'Sequence used up', h: `<p>All entries are consumed. Exactly two nodes still have degree 1: ${B(s.leaf, 'l')} and ${B(s.parent, 'p')}.</p><p>They must be joined by the final edge.</p>` }),
    final: s => ({ t: `Final edge: ${s.leaf} — ${s.parent}`, h: `<p>Add edge ${B(s.leaf, 'l')} — ${B(s.parent, 'p')}. That makes ${s.n - 1} edges for ${s.n} nodes: the tree is complete.</p>` }),
    tree: s => ({ t: 'Done: the tree', h: `<p>Same edges, redrawn as a rooted tree hanging from ${B(s.root)} (the largest label is always in the final edge).</p><p>Edges: ${s.list}</p>` }),
  },
  he: {
    h1: 'מפענח פרופר',
    lede: 'הזינו את תוויות הצמתים וסדרת פרופר. המפענח בונה מחדש את העץ המתויג היחיד, קשת אחר קשת, ומסביר כל בחירה. סדרה באורך n−2 מתארת תמיד עץ על n צמתים.',
    labelsLbl: 'תוויות הצמתים (מופרדות ברווח או בפסיק; ריק = 1…n)', seqLbl: 'סדרת פרופר', build: 'בנה עץ',
    prev: 'הקודם ▶', next: '◀ הבא', play: '◀ הפעל', pause: '❚❚ השהה', speed: 'מהירות',
    lgLeaf: 'העלה הקטן ביותר', lgSeq: 'איבר בסדרה', lgGone: 'הוסר',
    tip: 'טיפ: מקשי החצים מקדמים צעד, רווח מפעיל. התוויות ממוינות מספרית אם כולן מספרים, אחרת לפי סדר אלפביתי.',
    seqK: 'סדרה', degK: 'דרגות', empty: 'ריקה', deg: 'דרגה', svg: 'העץ בבנייה',
    counter: (i, n) => `צעד ${i} מתוך ${n}`,
    eUnique: 'כל תווית חייבת להיות ייחודית.', eMin: 'עץ צריך לפחות 2 צמתים.',
    eLen: (n, k) => `עם ${n} תוויות הסדרה חייבת להכיל בדיוק ${n - 2} איברים (יש בה ${k}).`,
    eBad: v => `איברים בסדרה שאינם ברשימת התוויות: ${v}.`,
    start: s => ({ t: 'הכנה: חישוב דרגות', h: `<p>בסדרה יש ${B(s.k)} איברים, לכן לעץ יש ${B(`${s.k}+2 = ${s.n}`)} צמתים ו־${B(s.n - 1)} קשתות.</p>
      <p>הדרגה של כל צומת היא <b>1 + (מספר הפעמים שהוא מופיע בסדרה)</b>. צמתים שלא מופיעים כלל הם בעלי דרגה 1, כלומר עלים.</p>
      <p>העלים כרגע: ${B(s.leaves || '–')}.</p>` }),
    pick: s => ({ t: `צעד ${s.i}: קריאת „${s.parent}”`, h: `<p>האיבר הבא בסדרה הוא ${B(s.parent, 'p')}.</p>
      <p>העלים כרגע (דרגה 1): ${B(s.leaves)}. הקטן ביותר הוא ${B(s.leaf, 'l')}.</p>
      <p>הסדרה נוצרה על ידי הסרה חוזרת של העלה הקטן ביותר ורישום השכן שלו, ולכן ${B(s.leaf, 'l')} היה מחובר ל־${B(s.parent, 'p')}.</p>` }),
    link: s => ({ t: `צעד ${s.i}: חיבור ${s.leaf} — ${s.parent}`, h: `<p>מוסיפים את הקשת ${B(s.leaf, 'l')} — ${B(s.parent, 'p')}.</p>
      <p>${B(s.leaf, 'l')} סיים את תפקידו: הדרגה שלו יורדת ל־0 והוא מוסר.</p>
      <p>${B(s.parent, 'p')} ניצל אחת מהקשתות שלו: דרגה ${s.d} ← ${s.d - 1}.${s.d === 2 ? ' כעת הוא עצמו עלה.' : ''}</p>` }),
    last: s => ({ t: 'הסדרה נגמרה', h: `<p>כל האיברים נקראו. נותרו בדיוק שני צמתים בדרגה 1: ${B(s.leaf, 'l')} ו־${B(s.parent, 'p')}.</p><p>הם מחוברים בקשת האחרונה.</p>` }),
    final: s => ({ t: `קשת אחרונה: ${s.leaf} — ${s.parent}`, h: `<p>מוסיפים את הקשת ${B(s.leaf, 'l')} — ${B(s.parent, 'p')}. כעת יש ${s.n - 1} קשתות ל־${s.n} צמתים: העץ שלם.</p>` }),
    tree: s => ({ t: 'סיום: העץ', h: `<p>אותן קשתות, מצוירות כעץ עם שורש ${B(s.root)} (התווית הגדולה ביותר תמיד נמצאת בקשת האחרונה).</p><p>קשתות: <bdi>${s.list}</bdi></p>` }),
  },
};
let lang = 'en';
try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('he') ? 'he' : 'en'); } catch { }
const t = () => T[lang];

function decode(labels, seq) {
  const L = [...labels].sort(cmp), deg = {}, edges = [], steps = [], n = L.length, k = seq.length;
  L.forEach(l => deg[l] = 1);
  seq.forEach(s => deg[s]++);
  const leaves = () => L.filter(l => deg[l] === 1).join(', ');
  const snap = o => steps.push({ edges: [...edges], deg: { ...deg }, n, k, ...o });
  snap({ kind: 'start', seqIdx: -1, leaves: leaves() });
  seq.forEach((p, i) => {
    const leaf = L.find(l => deg[l] === 1);
    snap({ kind: 'pick', i: i + 1, seqIdx: i, leaf, parent: p, leaves: leaves() });
    const d = deg[p];
    edges.push([leaf, p]); deg[leaf] = 0; deg[p]--;
    snap({ kind: 'link', i: i + 1, seqIdx: i, leaf, parent: p, d, fresh: true });
  });
  const [a, b] = L.filter(l => deg[l] === 1);
  snap({ kind: 'last', seqIdx: k, leaf: a, parent: b });
  edges.push([a, b]); deg[a] = deg[b] = 0;
  snap({ kind: 'final', seqIdx: k, leaf: a, parent: b, fresh: true });
  snap({ kind: 'tree', seqIdx: k, tree: true, root: L[n - 1], list: edges.map(e => `${e[0]}–${e[1]}`).join(', ') });
  return { L, steps };
}

function circleLayout(L) {
  const pos = {}, r = Math.min(W, H) / 2 - 40;
  L.forEach((l, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / L.length;
    pos[l] = [W / 2 + r * Math.cos(a), H / 2 + r * Math.sin(a)]; });
  return pos;
}

function treeLayout(L, edges) {
  const adj = {}; L.forEach(l => adj[l] = []);
  edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
  const root = L[L.length - 1], depth = {}, x = {};
  let col = 0, maxD = 0;
  (function dfs(v, p, d) {
    depth[v] = d; maxD = Math.max(maxD, d);
    const kids = adj[v].filter(u => u !== p).sort(cmp);
    if (!kids.length) { x[v] = col++; return; }
    kids.forEach(u => dfs(u, v, d + 1));
    x[v] = (x[kids[0]] + x[kids[kids.length - 1]]) / 2;
  })(root, null, 0);
  const pos = {}, sx = (W - 80) / Math.max(1, col - 1), sy = (H - 80) / Math.max(1, maxD);
  L.forEach(l => pos[l] = [col === 1 ? W / 2 : 40 + x[l] * sx, 40 + depth[l] * sy]);
  return pos;
}

let data = null, cur = 0, pos = {}, timer = null, anim = null, lastErr = null;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };

// Phones get a portrait canvas so nodes stay finger-sized instead of shrinking with a wide one.
function fitStage() {
  const narrow = $('svg').clientWidth < 500, w = narrow ? 360 : 640, h = narrow ? 440 : 460;
  if (w === W && h === H) return false;
  W = w; H = h; $('svg').setAttribute('viewBox', `0 0 ${W} ${H}`); pos = {}; return true;
}
addEventListener('resize', () => { if (data && fitStage()) render(); });

function render() {
  const { L, steps } = data, s = steps[cur], seq = data.seq, tx = t()[s.kind](s);
  $('counter').textContent = t().counter(cur + 1, steps.length);
  $('explain').innerHTML = `<h2>${tx.t}</h2>${tx.h}`;
  $('prev').disabled = cur === 0; $('next').disabled = cur === steps.length - 1;
  $('seqStrip').innerHTML = `<span class="k">${t().seqK}</span>` + (seq.length ? seq.map((v, i) =>
    `<span class="chip ${i < s.seqIdx || (i === s.seqIdx && s.fresh) ? 'done' : i === s.seqIdx ? 'cur' : ''}">${v}</span>`).join('') : `<span class="chip">${t().empty}</span>`);
  $('degStrip').innerHTML = `<span class="k">${t().degK}</span>` + L.map(l =>
    `<span class="chip ${s.deg[l] === 0 ? 'zero' : !s.fresh && l === s.leaf ? 'leaf' : ''}" dir="ltr">${l}: ${s.deg[l]}</span>`).join('');

  const svg = $('svg'); svg.textContent = '';
  const lines = s.edges.map(([a, b], i) => {
    const ln = el('line', { class: 'edge' + (s.fresh && i === s.edges.length - 1 ? ' new' : ''), pathLength: 1 });
    ln._ab = [a, b]; svg.append(ln); return ln;
  });
  const nodes = L.map(l => {
    const cls = s.tree ? '' : l === s.leaf ? 'leaf' : l === s.parent ? 'parent' : s.deg[l] === 0 ? 'gone' : '';
    const g = el('g', { class: 'node ' + cls });
    g.append(el('circle', { r: R }));
    const tt = el('text', {}); tt.textContent = l; g.append(tt);
    if (!s.tree) { const d = el('text', { class: 'deg', y: R + 13 }); d.textContent = `${t().deg} ${s.deg[l]}`; g.append(d); }
    g._l = l; svg.append(g); return g;
  });
  const target = s.tree ? treeLayout(L, s.edges) : circleLayout(L);
  const from = { ...pos }, t0 = performance.now(), dur = 700;
  cancelAnimationFrame(anim);
  (function tick(now) {
    let k = Math.min(1, (now - t0) / dur); k = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    L.forEach(l => { const f = from[l] || target[l]; pos[l] = [f[0] + (target[l][0] - f[0]) * k, f[1] + (target[l][1] - f[1]) * k]; });
    nodes.forEach(g => g.setAttribute('transform', `translate(${pos[g._l]})`));
    lines.forEach(ln => { const [a, b] = ln._ab;
      ln.setAttribute('x1', pos[a][0]); ln.setAttribute('y1', pos[a][1]); ln.setAttribute('x2', pos[b][0]); ln.setAttribute('y2', pos[b][1]); });
    if (k < 1) anim = requestAnimationFrame(tick);
  })(t0);
}

function go(i) { cur = Math.max(0, Math.min(data.steps.length - 1, i)); render(); }
function stop() { clearInterval(timer); timer = null; $('play').textContent = t().play; }
function play() {
  if (timer) return stop();
  if (cur === data.steps.length - 1) go(0);
  $('play').textContent = t().pause;
  timer = setInterval(() => cur < data.steps.length - 1 ? go(cur + 1) : stop(), +$('speed').value);
}

function showErr() { $('err').textContent = lastErr ? (typeof lastErr === 'string' ? t()[lastErr] : t()[lastErr[0]](...lastErr.slice(1))) : ''; }

function build(e) {
  e && e.preventDefault(); stop();
  const seq = split($('seq').value);
  let labels = split($('labels').value);
  if (!labels.length) labels = Array.from({ length: seq.length + 2 }, (_, i) => String(i + 1));
  const bad = [...new Set(seq.filter(v => !labels.includes(v)))];
  lastErr = new Set(labels).size !== labels.length ? 'eUnique'
    : labels.length < 2 ? 'eMin'
    : seq.length !== labels.length - 2 ? ['eLen', labels.length, seq.length]
    : bad.length ? ['eBad', bad.join(', ')] : null;
  showErr();
  if (lastErr) return;
  data = { ...decode(labels, seq), seq }; pos = {}; fitStage(); cur = 0; render();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch { }
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
  document.title = t().h1;
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = t()[n.dataset.t]);
  $('svg').setAttribute('aria-label', t().svg);
  $('lang').textContent = l === 'he' ? 'English' : 'עברית';
  $('lang').lang = l === 'he' ? 'en' : 'he';
  $('play').textContent = timer ? t().pause : t().play;
  showErr();
  if (data) render();
}

$('f').addEventListener('submit', build);
$('lang').onclick = () => setLang(lang === 'he' ? 'en' : 'he');
$('prev').onclick = () => { stop(); go(cur - 1); };
$('next').onclick = () => { stop(); go(cur + 1); };
$('play').onclick = play;
$('speed').oninput = () => { if (timer) { stop(); play(); } };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !data) return;
  const fwd = lang === 'he' ? 'ArrowLeft' : 'ArrowRight', back = lang === 'he' ? 'ArrowRight' : 'ArrowLeft';
  if (e.key === fwd) { stop(); go(cur + 1); }
  else if (e.key === back) { stop(); go(cur - 1); }
  else if (e.key === ' ') { e.preventDefault(); play(); }
});
setLang(lang);
build();
</script>
</body>
</html>
